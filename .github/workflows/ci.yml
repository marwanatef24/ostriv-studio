name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build .\OstrivStudio\OstrivStudio.csproj -c Release
      - run: dotnet run --project .\OstrivStudio.Tests -c Release -- "$env:RUNNER_TEMP\ostriv-studio-tests"
